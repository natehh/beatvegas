name: Daily NBA player props

# Settles yesterday's collected props against ESPN box scores, then snapshots
# today's player-prop lines from PropLine, and commits both JSONL
# ledgers back to the repo so the dataset accumulates for future backtests.
#
# One-time setup: add a repository secret named PROPLINE_API_KEY
# (Settings -> Secrets and variables -> Actions) with a free key from
# https://prop-line.com/#signup . Settlement needs no key.
#
# Budget: PropLine's free tier is 1,000 requests/day and charges 1 request
# per event (plus 1 for the event list), so the full 7-market set for a
# 15-game slate costs ~16 requests/day. The old Odds API source remains
# available via `--source oddsapi` (secret THE_ODDS_API_KEY); it charges
# ~3 credits/game for 3 markets from a 500/month budget.

on:
  schedule:
    # 15:00 UTC daily = 9am MT (8am in winter; GitHub cron is UTC and does
    # not follow DST). A 24h window then covers today's afternoon/evening
    # slate (incl. weekend matinees) plus tomorrow's early games, and last
    # night's games finished long ago.
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      skip_collect:
        description: "Settle only, skip the Odds API collection"
        type: boolean
        default: false
      hours_ahead:
        description: "Collect games tipping within this many hours"
        type: string
        default: "24"

permissions:
  contents: write

concurrency:
  group: daily-props
  cancel-in-progress: false

jobs:
  props:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Settle previous props and collect today's
        env:
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
        run: |
          ARGS=""
          if [ "${{ inputs.skip_collect }}" = "true" ]; then ARGS="--skip-collect"; fi
          python scripts/daily_prop_pipeline.py --source propline \
            --hours-ahead "${{ inputs.hours_ahead || '24' }}" $ARGS

      - name: Upload raw snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prop-snapshots-${{ github.run_id }}
          path: data/props/snapshots/
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit ledgers
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in data/props/prop_quotes.jsonl data/props/prop_settled.jsonl; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "No ledger changes to commit."
            exit 0
          fi
          git commit -m "Daily props: quotes + settlements $(date -u +%F) [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
